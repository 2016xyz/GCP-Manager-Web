# =============================================================================
# 宝塔面板 · Nginx 伪静态规则
#
# 用法：宝塔 → 网站 → 你的站点 → 设置 → 伪静态 → 把本文件内容整段粘进去 → 保存
#
# 前置条件（宝塔里必须做对，否则规则不生效）：
#   1. 网站 → 设置 → 网站目录 → **运行目录设为 /public**
#      （只把域名指向应用根目录会让 src/、data/ 暴露在 Web 下 —— 严重风险）
#   2. PHP 版本 ≥ 8.0，并在「设置 → 禁用函数」里**放行**：
#         proc_open、proc_get_status、exec、shell_exec、putenv、symlink
#      （后台任务与 SSH 执行依赖 proc_open；宝塔默认会禁用这些函数）
#   3. 安装扩展：pdo_sqlite、sqlite3、openssl、curl、mbstring、zlib、sockets、gd
#      （宝塔 → 软件商店 → PHP 8.x → 设置 → 安装扩展）
#
# ★★ 本文件**绝不能**定义 `location = /index.php` ★★
#   宝塔的站点配置里已经有一份 PHP-FPM 转发：
#       location ~ [^/]\.php(/|$) { fastcgi_pass unix:/tmp/php-cgi-XX.sock; ... }
#   nginx 的匹配优先级是「精确 = > ^~ 前缀 > 正则（按书写顺序）> 最长前缀」。
#   一旦写上 `location = /index.php { ... }`（精确匹配，优先级最高），它就会
#   **盖掉**宝塔那份带 fastcgi_pass 的正则 location。而伪静态片段里通常没有
#   fastcgi_pass，于是 /index.php 退化成静态文件被**直接下载**：
#       GET /login  → 200，Content-Type: application/octet-stream，
#                    内容就是 public/index.php 的源码（含全部配置）
#   这是极易踩、且后果严重（源码泄漏）的坑 —— 一定要把 PHP 解析留给宝塔的
#   enable-php-XX.conf。需要调超时/上传上限请用**服务器级**指令（见文件末尾说明）。
# =============================================================================

# ── 1. 敏感路径一律拒绝（纵深防御：即使运行目录设错也读不到）─────────────
# 用 ^~ 前缀匹配：它的优先级高于正则，能稳定压过宝塔的 PHP 正则 location，
# 确保 /src/*.php 这类请求不会被送进 PHP-FPM 去执行。
location ^~ /src/    { return 404; }
location ^~ /bin/    { return 404; }
location ^~ /bt/     { return 404; }
location ^~ /data/   { return 404; }
location ^~ /tools/  { return 404; }
location ^~ /tests/  { return 404; }
# 数据库、密钥、标记文件的常见后缀（正则：出现在上面 ^~ 之后，只兜底非目录路径）
location ~* \.(db|sqlite|sqlite3|db-wal|db-shm|pem|key|log|ini|sh|md)$ { return 404; }
# 隐藏文件（.git/.env/.user.ini 等）
location ~ /\. { return 404; }

# ── 2. 实时日志 WebSocket → 独立 CLI 服务 ────────────────────────────────
# bin/ws-server.php 需要单独常驻：
#     <PHP_BIN> <应用目录>/bin/ws-server.php --host 127.0.0.1 --port 9001
# 若没起这个服务，前端会自动退化为轮询拉日志（功能不受影响，只是不实时）。
location = /ws/logs {
    proxy_pass http://127.0.0.1:9001;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
}

# ── 3. 静态资源直接返回（不经过 PHP）──────────────────────────────────────
location ^~ /static/ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800";
    access_log off;
    try_files $uri =404;
}
location = /favicon.ico {
    expires 30d;
    access_log off;
    try_files $uri =404;
}

# ── 4. 其余全部走单一入口 index.php ──────────────────────────────────────
# 不要在这里写 location = /index.php —— PHP 解析交给宝塔的 enable-php-XX.conf
location / {
    try_files $uri $uri/ /index.php?$query_string;
}

# ── 5. 需要更长的超时 / 更大的上传上限？──────────────────────────────────
# 不要去覆盖 PHP 的 location。把下面两行写进**服务器级**作用域即可（会被各
# location 继承），推荐放在宝塔的站点扩展目录（面板升级/改配置都不会清掉它）：
#
#     /www/server/panel/vhost/nginx/extension/<你的域名>/tuning.conf
#
#         client_max_body_size     8m;
#         fastcgi_read_timeout   300s;
#         fastcgi_send_timeout   300s;
#
# 该目录已在站点配置里被 include（在 server 块内、location 之外），放这里安全。
