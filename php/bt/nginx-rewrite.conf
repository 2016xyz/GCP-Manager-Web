# =============================================================================
# 宝塔面板 · Nginx 伪静态规则
#
# 用法：宝塔 → 网站 → 你的站点 → 设置 → 伪静态 → 把本文件内容整段粘进去 → 保存
#
# 前置条件（宝塔里必须做对，否则规则不生效）：
#   1. 网站 → 设置 → 网站目录 → **运行目录设为 /public**
#      （只把域名指向 php/ 根目录会让 src/、data/ 暴露在 Web 下 —— 严重风险）
#   2. PHP 版本 ≥ 8.0，并在「设置 → 禁用函数」里**放行**：
#         proc_open、proc_get_status、exec、shell_exec、putenv、symlink
#      （后台任务与 SSH 执行依赖 proc_open；宝塔默认会禁用这些函数）
#   3. 安装扩展：pdo_sqlite、sqlite3、openssl、curl、mbstring、zlib、sockets
#      （宝塔 → 软件商店 → PHP 8.x → 设置 → 安装扩展）
#
# 注意：宝塔的站点配置文件里已经有一份 location ~ \.php$ 的 PHP-FPM 转发，
#      所以本规则**不要**重复定义 PHP 解析，只做「路由到入口 + 拒绝敏感路径」。
# =============================================================================

# ── 1. 敏感路径一律拒绝（纵深防御：即使运行目录设错也读不到）─────────────
location ~ ^/(src|bin|bt|data|tools|vendor_src)/ {
    deny all;
    return 404;
}
location ~ ^/data/ {
    deny all;
    return 404;
}
# 数据库、密钥、标记文件的常见后缀
location ~* \.(db|sqlite|sqlite3|db-wal|db-shm|pem|key|log|ini|sh|md)$ {
    deny all;
    return 404;
}
# 隐藏文件（.git/.env/.user.ini 等）
location ~ /\. {
    deny all;
    return 404;
}

# ── 2. 实时日志 WebSocket → 独立 CLI 服务 ────────────────────────────────
# bin/ws-server.php 需要单独常驻（宝塔「计划任务 → Shell 脚本」或 supervisor 拉起）：
#     php /www/wwwroot/<你的域名>/php/bin/ws-server.php --host 127.0.0.1 --port 9001
# 若没起这个服务，前端会自动退化为轮询拉日志（功能不受影响，只是不实时）。
location = /ws/logs {
    proxy_pass http://127.0.0.1:9001;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
}

# ── 3. 静态资源直接返回（不经过 PHP）──────────────────────────────────────
location ^~ /static/ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800";
    access_log off;
    try_files $uri =404;
}
location = /favicon.ico {
    expires 30d;
    access_log off;
    try_files $uri =404;
}

# ── 4. 其余全部走单一入口 index.php ──────────────────────────────────────
location / {
    try_files $uri $uri/ /index.php?$query_string;
}

# ── 5. 单入口自身 ────────────────────────────────────────────────────────
location = /index.php {
    # 宝塔的 PHP-FPM 转发由站点配置提供，这里只补超时与请求体上限
    client_max_body_size 8m;
    fastcgi_read_timeout 300s;
}
